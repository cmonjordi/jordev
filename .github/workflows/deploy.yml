name: Deploy

# Despliegue manual a propósito: hasta que no existan los secretos de Cloudflare
# en el repositorio, un deploy automático en cada push solo dejaría la acción en rojo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build y deploy en Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
